name: Validate public repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate repository records and links
        run: node scripts/validate-public-repo.mjs
