name: Validate public examples

on:
  pull_request:
    paths:
      - examples/**
      - .github/workflows/examples.yml
  push:
    branches: [main]
    paths:
      - examples/**
      - .github/workflows/examples.yml

permissions:
  contents: read

jobs:
  full-stack-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/full-stack-starter
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/full-stack-starter/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Build the example
        run: npm run build
